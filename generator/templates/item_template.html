<!doctype html>
<html lang="en">
<head>
  <!-- Google tag (gtag.js) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-HLPF1R9ZNL"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-HLPF1R9ZNL');
  </script>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{TITLE}} - TEK2day Pulse</title>
  
  <!-- Open Graph / Facebook -->
  <meta property="og:type" content="article">
  <meta property="og:title" content="{{TITLE}}">
  <meta property="og:description" content="{{SUMMARY}}">
  <meta property="og:url" content="{{ABS_PERMALINK}}">
  <meta property="og:image" content="{{OG_IMAGE}}">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:site_name" content="TEK2day Pulse">
  
  <!-- Twitter Card -->
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="{{TITLE}}">
  <meta name="twitter:description" content="{{SUMMARY}}">
  <meta name="twitter:image" content="{{OG_IMAGE}}">
  
  <!-- Standard meta -->
  <meta name="description" content="{{SUMMARY}}">
  <link rel="canonical" href="{{ABS_PERMALINK}}">
  
  <style>
    /* Batch 3.12: permalink shares the front-page Editorial Premium tokens —
       warm paper, indigo ink, serif headlines. Placeholders unchanged. */
    :root {
      --bg: #f7f7f4;
      --card: #ffffff;
      --ink: #0f172a;
      --ink-soft: #334155;
      --muted: #5b6b7f;
      --line: #e5e3dc;
      --line-light: #f0efe9;
      --ai: #4f46e5;
      --ai-deep: #4338ca;
      --ai-light: #eef2ff;
      --serif: Georgia, 'Times New Roman', 'Source Serif 4', serif;
      --sans: 'Inter', system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: var(--sans);
      background: var(--bg);
      color: var(--ink);
      line-height: 1.6;
      padding: 2rem 1rem;
      -webkit-font-smoothing: antialiased;
    }
    .container {
      max-width: 720px;
      margin: 0 auto;
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 18px;
      padding: 2rem;
      box-shadow: 0 2px 8px rgba(15, 23, 42, 0.06), 0 16px 40px rgba(15, 23, 42, 0.08);
    }
    .header {
      text-align: center;
      padding-bottom: 1.5rem;
      border-bottom: 1px solid var(--line);
      margin-bottom: 1.25rem;
    }
    .logo {
      width: 52px;
      height: 52px;
      border-radius: 14px;
      margin-bottom: 0.75rem;
    }
    .site-name {
      font-size: 1.1rem;
      font-weight: 800;
      letter-spacing: -0.02em;
      color: var(--ink);
      text-decoration: none;
    }
    .site-name:hover { color: var(--ai-deep); }
    h1 {
      font-family: var(--serif);
      font-size: 2rem;
      font-weight: 800;
      line-height: 1.2;
      letter-spacing: -0.02em;
      margin-bottom: 1rem;
      color: var(--ink);
      text-wrap: balance;
    }
    .meta {
      display: flex;
      gap: 0.75rem;
      align-items: baseline;
      flex-wrap: wrap;
      color: var(--muted);
      font-size: 0.85rem;
      margin-bottom: 1.5rem;
      line-height: 1.6;
    }
    .meta strong {
      color: var(--ink-soft);
    }
    .summary {
      font-size: 1.05rem;
      line-height: 1.65;
      color: var(--ink-soft);
      margin-bottom: 2rem;
      padding: 1.5rem;
      background: var(--bg);
      border-left: 4px solid var(--ai);
      border-radius: 8px;
    }
    .cta {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      background: var(--ai);
      color: white;
      padding: 0.75rem 1.75rem;
      min-height: 44px;
      border-radius: 999px;
      text-decoration: none;
      font-weight: 700;
      transition: transform 0.15s ease, box-shadow 0.22s ease, background 0.15s ease;
    }
    .cta:hover {
      background: var(--ai-deep);
      transform: translateY(-2px);
      box-shadow: 0 4px 12px rgba(79, 70, 229, 0.3);
    }
    .cta:focus-visible { outline: 2px solid var(--ai-deep); outline-offset: 3px; }
    .footer {
      margin-top: 3rem;
      padding-top: 1.5rem;
      border-top: 1px solid var(--line);
      text-align: center;
      color: var(--muted);
      font-size: 0.85rem;
    }
    .footer a {
      color: var(--ai-deep);
      text-decoration: none;
      font-weight: 600;
    }
    .footer a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <a href="/" aria-label="TEK2day Pulse Home">
        <img src="/icons/t2d-pulse-192.png" alt="TEK2day Pulse" class="logo" width="52" height="52">
      </a>
      <div><a href="/" class="site-name">TEK2day Pulse</a></div>
    </div>
    
    <article>
      <h1>{{TITLE}}</h1>
      
      <div class="meta">
        <span><strong>Source:</strong> {{SOURCE}}</span>
        <span>•</span>
        <span>{{DATE}}</span>
        <span>•</span>
        <span>{{DOMAIN}}</span>
      </div>
      
      <div class="summary">
        {{SUMMARY}}
      </div>
      
      <a href="{{SOURCE_URL}}" class="cta" target="_blank" rel="noopener">
        Read Full Article →
      </a>
    </article>
    
    <div class="footer">
      <p>Curated by <a href="/">TEK2day Pulse</a> — AI, Software &amp; FinTech</p>
      <p>Headlines and excerpts link to the original publishers.</p>
    </div>
  </div>
</body>
</html>
