<!doctype html>
<html lang="en">
<head>
  <!-- Google tag (gtag.js) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-HLPF1R9ZNL"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-HLPF1R9ZNL');
  </script>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{TITLE}} - TEK2day Pulse</title>
  
  <!-- Open Graph / Facebook -->
  <meta property="og:type" content="article">
  <meta property="og:title" content="{{TITLE}}">
  <meta property="og:description" content="{{SUMMARY}}">
  <meta property="og:url" content="{{ABS_PERMALINK}}">
  <meta property="og:image" content="{{OG_IMAGE}}">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:site_name" content="TEK2day Pulse">
  
  <!-- Twitter Card -->
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="{{TITLE}}">
  <meta name="twitter:description" content="{{SUMMARY}}">
  <meta name="twitter:image" content="{{OG_IMAGE}}">
  
  <!-- Standard meta -->
  <meta name="description" content="{{SUMMARY}}">
  
  <style>
    :root {
      --bg: #f7f9fc;
      --card: #ffffff;
      --ink: #0f172a;
      --muted: #64748b;
      --line: #e2e8f0;
      --brand: #ef4444;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color: var(--ink);
      line-height: 1.6;
      padding: 2rem 1rem;
    }
    .container {
      max-width: 720px;
      margin: 0 auto;
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 2rem;
      box-shadow: 0 4px 20px rgba(0,0,0,0.06);
    }
    .header {
      text-align: center;
      padding-bottom: 1.5rem;
      border-bottom: 1px solid var(--line);
      margin-bottom: 1.25rem;
    }
    .logo {
      width: 120px;
      height: auto;
      margin-bottom: 1rem;
    }
    .site-name {
      font-size: 1.25rem;
      font-weight: 700;
      color: var(--brand);
      text-decoration: none;
    }
    h1 {
      font-size: 2rem;
      font-weight: 800;
      line-height: 1.2;
      margin-bottom: 1rem;
      color: var(--ink);
    }
    .meta {
      display: flex;
      gap: 1rem;
      align-items: center;
      flex-wrap: wrap;
      color: var(--muted);
      font-size: 0.9rem;
      margin-bottom: 1.5rem;
    }
    .meta strong {
      color: var(--ink);
    }
    .summary {
      font-size: 1.1rem;
      line-height: 1.7;
      color: var(--ink);
      margin-bottom: 2rem;
      padding: 1.5rem;
      background: var(--bg);
      border-left: 4px solid var(--brand);
      border-radius: 8px;
    }
    .cta {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      background: var(--brand);
      color: white;
      padding: 0.75rem 1.5rem;
      border-radius: 8px;
      text-decoration: none;
      font-weight: 600;
      transition: transform 0.2s, box-shadow 0.2s;
    }
    .cta:hover {
      transform: translateY(-2px);
      box-shadow: 0 4px 12px rgba(239, 68, 68, 0.3);
    }
    .footer {
      margin-top: 3rem;
      padding-top: 1.5rem;
      border-top: 1px solid var(--line);
      text-align: center;
      color: var(--muted);
      font-size: 0.9rem;
    }
    .footer a {
      color: var(--brand);
      text-decoration: none;
    }
    .footer a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <a href="/">
        <img src="/icons/t2d-pulse-192.png" alt="TEK2day Pulse" class="logo">
      </a>
    </div>
    
    <article>
      <h1>{{TITLE}}</h1>
      
      <div class="meta">
        <span><strong>Source:</strong> {{SOURCE}}</span>
        <span>•</span>
        <span>{{DATE}}</span>
        <span>•</span>
        <span>{{DOMAIN}}</span>
      </div>
      
      <div class="summary">
        {{SUMMARY}}
      </div>
      
      <a href="{{SOURCE_URL}}" class="cta" target="_blank" rel="noopener">
        Read Full Article →
      </a>
    </article>
    
    <div class="footer">
      <p>Curated by <a href="/">TEK2day Pulse</a> — the latest Technology news</p>
    </div>
  </div>
</body>
</html>
