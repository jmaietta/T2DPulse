<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>T2D Pulse</title>

  <meta property="og:type" content="website">
  <meta property="og:title" content="T2D Pulse - AI, Software & FinTech News">
  <meta property="og:description" content="AI, Software, and FinTech News.">
  <meta property="og:url" content="https://pulse.tek2dayholdings.com/">
  <meta property="og:image" content="https://pulse.tek2dayholdings.com/icons/T2D_Pulse_Banner.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">

  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="T2D Pulse - AI, Software & FinTech News">
  <meta name="twitter:description" content="AI, Software, and FinTech News.">
  <meta name="twitter:image" content="https://pulse.tek2dayholdings.com/icons/T2D_Pulse_Banner.png">

  <meta name="theme-color" content="#0f172a" />
  <link rel="manifest" href="./manifest.webmanifest" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>
    /* ============================================
       DESIGN TOKENS - Modern Color Palette
       ============================================ */
    :root {
      /* Refined neutrals */
      --bg: #f8fafc;
      --bg-subtle: #f1f5f9;
      --card: #ffffff;
      --ink: #0f172a;
      --ink-soft: #334155;
      --muted: #64748b;
      --line: #e2e8f0;
      --line-light: #f1f5f9;
      
      /* Vibrant accents */
      --ai: #6366f1;
      --ai-light: #eef2ff;
      --ai-border: rgba(99, 102, 241, 0.2);
      --sw: #f97316;
      --ft: #10b981;
      
      /* Layout */
      --radius: 16px;
      --radius-sm: 12px;
      --radius-xs: 8px;
      --shadow-sm: 0 1px 2px rgba(15, 23, 42, 0.04);
      --shadow: 0 1px 3px rgba(15, 23, 42, 0.04), 0 4px 12px rgba(15, 23, 42, 0.03);
      --shadow-lg: 0 4px 16px rgba(15, 23, 42, 0.08), 0 8px 32px rgba(15, 23, 42, 0.04);
      
      /* Transitions */
      --transition-fast: 0.15s ease;
      --transition: 0.2s ease;
    }

    /* ============================================
       BASE STYLES
       ============================================ */
    *, *::before, *::after {
      box-sizing: border-box;
    }
    
    html, body {
      height: 100%;
    }
    
    body {
      margin: 0;
      background: var(--bg);
      color: var(--ink);
      font-family: 'Inter', system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif;
      font-size: 16px;
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    /* Accessibility - Screen reader only */
    .sr-only {
      position: absolute !important;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }

    /* Focus states for keyboard navigation */
    a:focus-visible,
    button:focus-visible,
    input:focus-visible {
      outline: 2px solid var(--ai);
      outline-offset: 2px;
    }

    /* Reduced motion preference */
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.01ms !important;
        transition-duration: 0.01ms !important;
      }
    }

    /* ============================================
       HEADER - Sticky with blur effect
       ============================================ */
    header.site {
      position: sticky;
      top: 0;
      z-index: 100;
      background: rgba(255, 255, 255, 0.85);
      backdrop-filter: blur(12px) saturate(180%);
      -webkit-backdrop-filter: blur(12px) saturate(180%);
      border-bottom: 1px solid rgba(0, 0, 0, 0.06);
      transition: box-shadow var(--transition);
    }
    
    header.site.shadow {
      box-shadow: 0 4px 24px rgba(15, 23, 42, 0.06);
    }

    .site-inner {
      max-width: 1200px;
      margin: 0 auto;
      padding: 0.75rem 1.5rem;
      display: flex;
      align-items: center;
      gap: 1rem;
    }

    /* Logo */
    header.site img.brand-mark {
      width: 52px;
      height: 52px;
      border-radius: 14px;
      transition: box-shadow var(--transition);
    }
    
    header.site a:hover img.brand-mark,
    header.site a:focus-visible img.brand-mark {
      box-shadow: 0 0 0 4px rgba(99, 102, 241, 0.15);
    }

    header.site h1 {
      font-family: 'Orbitron', system-ui, sans-serif;
      font-weight: 700;
      letter-spacing: 0.4px;
      font-size: 1.25rem;
      margin: 0;
      color: var(--ink);
    }

    /* Header tag line */
    header .tag {
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }
    
    header .tag .date {
      font-size: 0.75rem;
      font-weight: 600;
      padding: 0.375rem 0.75rem;
      background: linear-gradient(135deg, #f1f5f9 0%, #e2e8f0 100%);
      border-radius: 20px;
      color: var(--ink-soft);
      letter-spacing: 0.02em;
      text-transform: uppercase;
    }
    
    header .tag .divider {
      width: 1px;
      height: 20px;
      background: var(--line);
    }
    
    header .tag .desc {
      font-size: 0.9rem;
      color: var(--muted);
      font-weight: 500;
    }
    
    header .tag .desc strong {
      font-weight: 600;
      color: var(--ink-soft);
    }

    .grow { flex: 1; }

    /* Header actions */
    .hdr-actions {
      display: flex;
      gap: 0.5rem;
      margin-left: auto;
      align-items: center;
    }

    /* Button styles */
    .btn {
      appearance: none;
      border: 1px solid var(--line);
      background: var(--card);
      color: var(--ink);
      cursor: pointer;
      border-radius: 999px;
      padding: 0.5rem 1rem;
      font-weight: 600;
      font-size: 0.875rem;
      box-shadow: none;
      transition: all var(--transition-fast);
    }
    
    .btn:hover {
      background: var(--bg-subtle);
      box-shadow: var(--shadow-sm);
    }
    
    .install { display: none; }

    /* ============================================
       SEARCH INPUT - Polished design
       ============================================ */
    .hdr-actions .search {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      background: var(--bg-subtle);
      border: 2px solid transparent;
      border-radius: var(--radius-sm);
      padding: 0.5rem 0.875rem;
      transition: all var(--transition-fast);
    }
    
    .hdr-actions .search:focus-within {
      background: var(--card);
      border-color: var(--ai);
      box-shadow: 0 0 0 4px rgba(99, 102, 241, 0.1);
    }
    
    .hdr-actions .search input {
      width: 180px;
      max-width: 40vw;
      border: 0;
      outline: 0;
      background: transparent;
      font: inherit;
      font-size: 0.9375rem;
      color: var(--ink);
    }
    
    .hdr-actions .search input::placeholder {
      color: var(--muted);
    }
    
    /* Hide browser search UI */
    .hdr-actions .search input[type="search"]::-webkit-search-decoration,
    .hdr-actions .search input[type="search"]::-webkit-search-cancel-button,
    .hdr-actions .search input[type="search"]::-webkit-search-results-button,
    .hdr-actions .search input[type="search"]::-webkit-search-results-decoration {
      display: none;
    }
    
    .hdr-actions .search input[type="search"] {
      -webkit-appearance: none;
      appearance: none;
    }
    
    .hdr-actions .search input[type="search"]::-ms-clear,
    .hdr-actions .search input[type="search"]::-ms-reveal {
      display: none;
      width: 0;
      height: 0;
    }

    /* ============================================
       MAIN CONTAINER
       ============================================ */
    #app {
      max-width: 1200px;
      margin: 0 auto 3rem;
      padding: 0 1.5rem;
    }

    /* Section container */
    #tek2day-pulse {
      background: transparent;
      border: none;
      padding: 0;
      box-shadow: none;
      margin-top: 2rem;
    }

    /* ============================================
       GRID LAYOUT
       ============================================ */
    .items {
      display: grid;
      gap: 1.5rem;
      /* Intelligent 3-column grid that falls back automatically */
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      align-items: start;
    }

    /* ============================================
       ARTICLE CARDS - Grid Style
       ============================================ */
    article {
      position: relative;
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      display: flex;
      flex-direction: column; /* Stack vertically for grid card */
      overflow: hidden; /* Ensure image doesn't bleed out */
      height: 100%; /* Uniform height */
      transition: transform var(--transition-fast), box-shadow var(--transition), border-color var(--transition);
      will-change: transform;
    }
    
    article:hover {
      transform: translateY(-4px);
      box-shadow: var(--shadow-lg);
      border-color: var(--line-light);
      z-index: 2;
    }
    
    /* Article thumbnail - Full width card header */
    .article-thumb {
      width: 100%;
      height: 180px;
      border-radius: 0;
      object-fit: cover;
      background: var(--bg-subtle);
      border-bottom: 1px solid var(--line-light);
    }

    /* Article content wrapper */
    .article-content {
      padding: 1.25rem;
      flex: 1;
      display: flex;
      flex-direction: column;
    }

    /* Featured/top article - Spans columns on larger screens */
    article.top {
      background: linear-gradient(180deg, rgba(99, 102, 241, 0.03) 0%, var(--card) 100%);
      border-color: var(--ai-border);
    }
    
    /* Hero layout logic */
    @media (min-width: 768px) {
      .items > article.top {
        grid-column: span 2;
      }
      .items > article.top .article-thumb {
         height: 300px;
      }
    }
    
    @media (min-width: 1100px) {
      .items > article.top {
        grid-column: 1 / -1; /* Full width */
        flex-direction: row; /* Side-by-side for hero */
        align-items: stretch;
      }
      .items > article.top .article-thumb {
        width: 50%;
        height: auto;
        min-height: 350px;
        border-bottom: none;
        border-right: 1px solid var(--line-light);
      }
      .items > article.top .article-content {
        padding: 2rem;
        justify-content: center;
      }
      .items > article.top h3 {
        font-size: 1.75rem;
      }
    }

    article.top:hover {
      border-color: rgba(99, 102, 241, 0.3);
    }

    /* Article title */
    h3 {
      margin: 0 0 0.75rem;
      font-size: 1.125rem;
      line-height: 1.4;
      font-weight: 700;
      letter-spacing: -0.01em;
    }
    
    h3 a {
      color: var(--ink);
      text-decoration: none;
      transition: color var(--transition-fast);
      display: block; /* Expand click area */
    }
    
    h3 a:hover {
      color: var(--ai);
    }

    /* Article meta */
    .meta {
      color: var(--muted);
      font-size: 0.75rem;
      margin-bottom: 0.75rem;
      display: flex;
      gap: 0.5rem;
      align-items: center;
      flex-wrap: wrap;
    }
    
    .meta .src {
      font-weight: 600;
      color: var(--ink-soft);
      letter-spacing: 0.01em;
    }

    /* Badges */
    .badge {
      display: inline-block;
      padding: 0.15rem 0.4rem;
      border-radius: 6px;
      font-size: 0.625rem;
      font-weight: 700;
      background: var(--ai);
      color: white;
      text-transform: uppercase;
      letter-spacing: 0.03em;
    }
    
    .badge.muted {
      background: var(--muted);
      opacity: 0.7;
    }

    /* Article summary */
    p[data-summary] {
      margin: 0;
      color: var(--ink-soft);
      font-size: 0.9375rem;
      line-height: 1.6;
      /* Clamp text to 3 lines for clean grid */
      display: -webkit-box;
      -webkit-line-clamp: 4;
      -webkit-box-orient: vertical;
      overflow: hidden;
      flex-grow: 1; /* Push footer down */
    }

    /* ============================================
       SHARE TOOLBAR
       ============================================ */
    .share {
      display: flex;
      gap: 0.5rem;
      margin-top: 1.25rem;
      padding-top: 1rem;
      border-top: 1px solid var(--line-light);
      align-items: center;
    }
    
    .share-btn {
      appearance: none;
      -webkit-appearance: none;
      border: none;
      background: transparent;
      color: var(--muted);
      padding: 0;
      font-size: 0.75rem;
      font-weight: 600;
      text-decoration: none;
      cursor: pointer;
      transition: color var(--transition-fast);
    }
    
    .share-btn:hover {
      color: var(--ai);
    }
    
    .share-btn.copy-url {
        margin-left: auto;
    }

    /* ============================================
       BACK TO TOP BUTTON
       ============================================ */
    .back-to-top {
      position: fixed;
      bottom: 2rem;
      right: 2rem;
      background: var(--ai);
      color: white;
      width: 48px;
      height: 48px;
      border-radius: 50%;
      border: none;
      box-shadow: var(--shadow-lg);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.5rem;
      opacity: 0;
      visibility: hidden;
      transform: translateY(20px);
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      z-index: 90;
      outline: none;
    }

    .back-to-top svg {
      width: 24px;
      height: 24px;
      fill: none;
      stroke: currentColor;
      stroke-width: 2.5;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .back-to-top.visible {
      opacity: 1;
      visibility: visible;
      transform: translateY(0);
    }

    .back-to-top:hover {
      transform: translateY(-4px);
      box-shadow: 0 10px 25px rgba(99, 102, 241, 0.4);
      background: #565add;
    }

    .back-to-top:focus-visible {
      box-shadow: 0 0 0 4px rgba(99, 102, 241, 0.3);
    }

    /* ============================================
       FOOTER
       ============================================ */
    .foot {
      margin-top: 3rem;
      padding-top: 2rem;
      border-top: 1px solid var(--line);
      color: var(--muted);
      font-size: 0.8125rem;
      text-align: center;
    }

    /* ============================================
       RESPONSIVE - Mobile
       ============================================ */
    @media (max-width: 768px) {
      .site-inner {
        padding: 0.625rem 1rem;
        flex-wrap: wrap;
      }
      
      header.site img.brand-mark {
        width: 44px;
        height: 44px;
      }
      
      header.site h1 {
        font-size: 1.1rem;
      }
      
      header .tag {
        flex: 1 1 100%;
        order: 3;
        margin-top: 0.5rem;
        flex-wrap: wrap;
        gap: 0.5rem;
      }
      
      header .tag .divider {
        display: none;
      }
      
      header .tag .desc {
        font-size: 0.85rem;
      }
      
      .hdr-actions {
        order: 2;
        flex: 0 1 auto;
      }
      
      .hdr-actions .search {
        flex: 1 1 auto;
        max-width: 60vw;
      }
      
      .hdr-actions .search input {
        width: 100%;
        font-size: 16px; /* Prevents iOS zoom */
      }
      
      .grow {
        display: none;
      }
      
      #app {
        padding: 0 1rem;
      }
      
      .items {
        grid-template-columns: 1fr; /* Force single column on mobile */
        gap: 1.5rem;
      }
      
      article {
        /* On mobile, standard card stack */
        flex-direction: column;
      }
      
      /* Reset hero styles on mobile */
      .items > article.top .article-thumb {
        width: 100%;
        height: 180px;
        border-right: none;
        border-bottom: 1px solid var(--line-light);
      }
      .items > article.top .article-content {
        padding: 1.25rem;
      }
      
      h3 {
        font-size: 1.125rem;
      }
      
      .share-btn {
        padding: 0.5rem 0; /* Larger touch target */
      }

      .back-to-top {
        bottom: 1.5rem;
        right: 1.5rem;
        width: 44px;
        height: 44px;
      }
    }

    @media (max-width: 400px) {
      .site-inner {
        padding: 0.5rem 0.75rem;
      }
      
      header.site img.brand-mark {
        width: 40px;
        height: 40px;
      }
      
      .hdr-actions .search {
        max-width: 55vw;
      }
      
      article {
        border-radius: var(--radius-sm);
      }
    }

    /* ============================================
       HIGH CONTRAST MODE
       ============================================ */
    @media (prefers-contrast: high) {
      article {
        border: 2px solid var(--ink);
      }
      
      .badge {
        border: 1px solid currentColor;
      }
    }
  

    /* ============================================
       PULSE BRIEF
       ============================================ */
    .pb {
      margin: 1.25rem 0 0.25rem;
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      overflow: hidden;
    }

.pb-row {
  display: flex;
  align-items: center;
  gap: 0.75rem;
  padding: 0.9rem 1rem;
}
.pb-row .pb-chips {
  display: flex;
  gap: 0.45rem;
  overflow-x: auto;
  padding-bottom: 0.1rem;
  scrollbar-width: thin;
}
.pb-row .pb-chips::-webkit-scrollbar { height: 6px; }
.pb-row .pb-chips::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.12); border-radius: 999px; }
.pb-row .pb-chips::-webkit-scrollbar-track { background: transparent; }
    .pb > summary {
      list-style: none;
      cursor: pointer;
      padding: 1rem 1.25rem;
      display: flex;
      align-items: center;
      gap: .75rem;
      user-select: none;
    }
    .pb > summary::-webkit-details-marker { display:none; }

    .pb-pill {
      display: inline-flex;
      align-items: center;
      gap: .4rem;
      padding: .25rem .6rem;
      border-radius: 999px;
      font-size: .75rem;
      font-weight: 800;
      letter-spacing: .06em;
      text-transform: uppercase;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid var(--line);
    }
    .pb-themes {
      color: var(--muted);
      font-size: .92rem;
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .pb-chev {
      margin-left: auto;
      width: 34px;
      height: 34px;
      border-radius: 999px;
      border: 1px solid var(--line);
      display: grid;
      place-items: center;
      background: rgba(255,255,255,0.04);
    }
    details[open].pb .pb-chev { transform: rotate(180deg); }

    .pb-body {
      padding: 0 1.25rem 1.25rem;
    }
        .pb-chips{
      display:flex;
      flex-wrap:wrap;
      gap:.5rem;
      margin: .75rem 0 1rem;
    }
    .pb-chip{
      font-size:.78rem;
      font-weight:800;
      letter-spacing:.02em;
      padding:.35rem .6rem;
      border:1px solid var(--line);
      border-radius:999px;
      background: rgba(255,255,255,0.03);
      color: var(--muted);
    }
    .pb-list{
      list-style:none;
      padding:0;
      margin:0;
      display:grid;
      gap:.65rem;
    }
    .pb-item a{
      display:flex;
      gap:.75rem;
      align-items:center;
      text-decoration:none;
      padding:.7rem .75rem;
      border:1px solid var(--line);
      border-radius: calc(var(--radius) - 6px);
      background: rgba(255,255,255,0.02);
    }
    .pb-item a:hover{
      background: rgba(255,255,255,0.04);
    }
    .pb-thumb{
      width:56px;
      height:42px;
      border-radius:10px;
      object-fit:cover;
      flex:0 0 auto;
      border:1px solid var(--line);
      background: rgba(255,255,255,0.04);
      display:block;
    }
    .pb-thumb--empty{
      background: rgba(255,255,255,0.03);
    }
    .pb-title{
      color: var(--text);
      font-weight:900;
      font-size:.95rem;
      line-height:1.15;
    }
    .pb-meta{
      margin-top:.2rem;
      color: var(--muted);
      font-size:.78rem;
      font-weight:700;
    }
    .pb-note{
      margin-top:.85rem;
      color: var(--muted);
      font-size: .82rem;
    }
    .pb-empty{ color: var(--muted); margin: 0; }

    @media (max-width: 520px){
      .pb > summary { padding: .9rem 1rem; }
      .pb-body { padding: 0 1rem 1rem; }
      .pb-themes { font-size: .88rem; }
    }

</style>

  <link rel="icon" type="image/png" sizes="32x32" href="./icons/t2d-pulse-32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="./icons/t2d-pulse-16.png">
  <link rel="apple-touch-icon" sizes="180x180" href="./icons/t2d-pulse-180.png">

  <link rel="canonical" href="https://pulse.tek2dayholdings.com/" />
  <meta property="og:site_name" content="T2D Pulse">
  <meta property="og:image:alt" content="T2D Pulse - AI, Software & FinTech news">
  <meta name="description" content="AI, Software, and FinTech News.">
</head>

<body>
  <header class="site">
    <div class="site-inner">
      <a href="/" aria-label="T2D Pulse Home">
        <img class="brand-mark" src="./icons/T2D_Pulse_Logo_2.png" alt="T2D Pulse">
      </a>
      <h1 class="sr-only">T2D Pulse</h1>
      <div class="tag">
        <span class="date">{{DATE_STR}}</span>
        <span class="divider"></span>
        <span class="desc"><strong>AI</strong>, <strong>Software</strong> & <strong>FinTech</strong> News</span>
      </div>
      <div class="grow"></div>
      <div class="hdr-actions">
        <form class="search" role="search" method="GET" action="/">
          <label for="t2d-q" class="sr-only">Search articles</label>
          <input id="t2d-q" name="q" type="search" placeholder="Search..." enterkeyhint="search" autocapitalize="off" autocomplete="off" />
        </form>
      </div>
    </div>
  </header>

  <div id="app">
    <section id="tek2day-pulse" aria-labelledby="tek2day-title">
            {{DAILY_BRIEF}}
<div class="items">
        {{AI_ITEMS}}
        {{SW_ITEMS}}
        {{FT_ITEMS}}
      </div>
      <p class="foot">© 2026 T2D Pulse. All rights reserved.</p>
    </section>
  </div>

  <button id="back-to-top" class="back-to-top" aria-label="Back to top">
    <svg viewBox="0 0 24 24">
      <path d="M12 19V5M5 12l7-7 7 7" />
    </svg>
  </button>

  <script>
    // Install prompt for PWA
    let deferredPrompt;
    window.addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault();
      deferredPrompt = e;
      const wrap = document.querySelector('.install');
      if (wrap) wrap.style.display = 'block';
    });
    
    document.getElementById('btnInstall')?.addEventListener('click', async () => {
      if (!deferredPrompt) return;
      deferredPrompt.prompt();
      await deferredPrompt.userChoice;
      deferredPrompt = null;
      document.querySelector('.install').style.display = 'none';
    });

    // Service worker registration
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js', { scope: './' });
      });
    }

    // Header shadow on scroll
    window.addEventListener('scroll', () => {
      const h = document.querySelector('header.site');
      if (!h) return;
      h.classList.toggle('shadow', window.scrollY > 8);
    }, { passive: true });
  </script>

  <script>
  (function() {
    const cards = document.querySelectorAll('#tek2day-pulse article');
    if (!cards.length) return;

    for (const card of cards) {
      const link = card.querySelector('h3 a');
      if (!link) continue;

      const originalUrl = link.href;
      let permalink = card.dataset.permalink || originalUrl;
      
      // Convert relative URLs to absolute
      if (permalink.startsWith('/')) {
        permalink = window.location.origin + permalink;
      }
      
      const title = link.textContent.trim();
      const brand = 'via T2D Pulse';
      const shareTitle = `${title} - ${brand}`;
      const encodedUrl = encodeURIComponent(permalink);
      const xShareUrl = `https://twitter.com/intent/tweet?url=${encodedUrl}&text=${encodeURIComponent(shareTitle)}`;

      // Create share toolbar
      const bar = document.createElement('div');
      bar.className = 'share';
      bar.innerHTML = `
        <a class="share-btn" href="${xShareUrl}" target="_blank" rel="noopener noreferrer">Share to X</a>
        <button class="share-btn copy-url" type="button" data-url="${permalink}">Copy Link</button>
      `;
      card.querySelector('.article-content').appendChild(bar);
    }

    // Copy URL handler with native share fallback
    document.addEventListener('click', async (e) => {
      const btn = e.target.closest('.copy-url');
      if (!btn) return;

      const url = btn.dataset.url;

      // Prefer native share on mobile
      if (navigator.share) {
        try {
          await navigator.share({ url });
          return;
        } catch (_) {}
      }

      // Fallback to clipboard
      try {
        await navigator.clipboard.writeText(url);
      } catch (err) {
        const ta = document.createElement('textarea');
        ta.value = url;
        ta.style.cssText = 'position:fixed;opacity:0';
        document.body.appendChild(ta);
        ta.select();
        document.execCommand('copy');
        ta.remove();
      }
      
      const originalText = btn.textContent;
      btn.textContent = 'Copied!';
      setTimeout(() => btn.textContent = originalText, 1500);
    });
  })();
  </script>

  <script>
  (function() {
    const btn = document.getElementById('back-to-top');
    if (!btn) return;

    // Show/hide based on scroll position
    window.addEventListener('scroll', () => {
      // Threshold: 300px
      if (window.scrollY > 300) {
        btn.classList.add('visible');
      } else {
        btn.classList.remove('visible');
      }
    }, { passive: true });

    // Scroll up smoothly on click
    btn.addEventListener('click', () => {
      window.scrollTo({
        top: 0,
        behavior: 'smooth'
      });
      // For accessibility, move focus back to top
      document.body.focus(); 
    });
  })();
  </script>

  <script>
  (function() {
    const container = document.getElementById('tek2day-pulse');
    const form = document.querySelector('.hdr-actions .search');
    const input = document.getElementById('t2d-q');
    if (!form || !input || !container) return;

    function buildHaystack(card) {
      const clone = card.cloneNode(true);
      // Remove elements we don't want to search
      clone.querySelectorAll('.host-pill, .byline, .count, .date, .publisher').forEach(n => n.remove());
      
      const selectors = ['h3', 'h2', '.title', '.headline', '.desc', '.summary', '.snippet', 'p', '.src'];
      const parts = [];
      
      for (const sel of selectors) {
        clone.querySelectorAll(sel).forEach(n => parts.push(n.textContent || ''));
      }
      
      // Include data attributes
      ['data-tickers', 'data-companies', 'data-keywords', 'data-source'].forEach(attr => {
        const v = card.getAttribute(attr);
        if (v) parts.push(v);
      });
      
      return parts.join(' ').replace(/\s+/g, ' ').trim().toLowerCase();
    }

    const itemsContainer = container.querySelector('.items');
    
    function tokenize(q) {
      return (q || '').toLowerCase().trim().split(/\s+/).filter(Boolean);
    }

    function applyFilter(q) {
      const tokens = tokenize(q);
      let total = 0;

      if (itemsContainer) {
        Array.from(itemsContainer.children).forEach(card => {
          const hay = buildHaystack(card);
          const match = tokens.every(t => hay.includes(t));
          card.style.display = match ? '' : 'none';
          if (match) total++;
        });
      }

      // Show/hide empty state
      let empty = document.getElementById('search-empty');
      if (!empty) {
        empty = document.createElement('div');
        empty.id = 'search-empty';
        empty.style.cssText = 'display:none;padding:2rem;color:var(--muted);text-align:center;grid-column:1/-1;';
        empty.setAttribute('role', 'status');
        empty.textContent = 'No articles found matching your search.';
        itemsContainer.appendChild(empty);
      }
      empty.style.display = tokens.length && total === 0 ? 'block' : 'none';
    }

    form.addEventListener('submit', (e) => {
      e.preventDefault();
      applyFilter(input.value);
      if (window.innerWidth > 720) {
        container.scrollIntoView({ behavior: 'smooth', block: 'start' });
      }
    });
    
    input.addEventListener('input', () => applyFilter(input.value), { passive: true });

    // Check for initial query param
    try {
      const q0 = new URLSearchParams(location.search).get('q');
      if (q0) {
        input.value = q0;
        applyFilter(q0);
      }
    } catch (_) {}
  })();
  </script>

  <script>
  (function() {
    // Only run if embedded in iframe
    if (window.self === window.top) return;
    
    document.addEventListener('click', function(e) {
      const link = e.target.closest('h3 a');
      if (!link) return;
      
      e.preventDefault();
      e.stopPropagation();
      
      window.parent.postMessage({
        type: 'article-click',
        url: link.href
      }, 'https://dash.tek2dayholdings.com');
    }, true);
  })();
  </script>
</body>
