<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>T2D Pulse</title>

  <!-- Social share (OG + Twitter) -->
  <meta property="og:type" content="website">
  <meta property="og:title" content="T2D Pulse — AI, Software & FinTech News">
  <meta property="og:description" content="AI, Software, and FinTech News.">
  <meta property="og:url" content="https://pulse.tek2dayholdings.com/">
  <meta property="og:image" content="https://pulse.tek2dayholdings.com/og/social-card.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">

  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="T2D Pulse — AI, Software & FinTech News">
  <meta name="twitter:description" content="AI, Software, and FinTech News.">
  <meta name="twitter:image" content="https://pulse.tek2dayholdings.com/og/social-card.png">

  <!-- PWA + icons (paths are relative to docs/index.html) -->
  <meta name="theme-color" content="#0f172a" />
<link rel="manifest" href="./manifest.webmanifest" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />

  <!-- Orbitron font for the headline -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;700;800&display=swap" rel="stylesheet">

  <style>
    :root{
      --ai:#6b8afd; --sw:#ff7a59; --ft:#00a87e;
      --ink:#0f172a; --muted:#5b6473; --line:#e6eaf0; --card:#ffffff; --bg:#f7f9fc;
      --r:16px; --shadow:0 10px 30px rgba(15,23,42,.06);
      --ink-soft:#1f2937;
    }

    *{box-sizing:border-box}
    html,body{height:100%}
    body{
      margin:0;background:var(--bg);color:var(--ink);
      font-family:system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;
      -webkit-font-smoothing:antialiased; -moz-osx-font-smoothing:grayscale;
    }

    /* Sticky header */
    header.site{
      position:sticky; top:0; z-index:50;
      backdrop-filter:saturate(160%) blur(10px); -webkit-backdrop-filter:saturate(160%) blur(10px);
      background:color-mix(in srgb, var(--bg) 88%, transparent);
      border-bottom:1px solid var(--line);
    }
    .site-inner{
      max-width:1100px;margin:0 auto;padding:.65rem 1rem;
      display:flex;align-items:center;gap:.9rem;
    }
    header.site img.brand-mark{width:66px;height:66px;border-radius:12px}
    header.site h1{
      font-family:'Orbitron', system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif;
      font-weight:700; letter-spacing:.4px; font-size:1.28rem; margin:0; color:var(--ink-soft);
    }
    
    /* keep an accessible title for SEO/screen readers, but visually hide it */
    .sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0;}
    header .tag{
      display:flex;align-items:center;gap:0.8rem;
    }
    header .date-badge{
      font-size:0.8rem;
      font-weight:600;
      color:var(--ink);
      padding:0.3rem 0.6rem;
      background:var(--line);
      border-radius:4px;
      text-transform:uppercase;
      letter-spacing:0.03em;
    }
    header .divider{
      width:1px;height:20px;background:var(--line);
    }
    header .desc{
      font-size:0.95rem;
      color:var(--ink-soft);
      font-weight:500;
    }
    header .desc strong{
      font-weight:700;
      color:var(--ink);
    }
    .grow{flex:1}
    .hdr-actions{display:flex;gap:.5rem;margin-left:auto;align-items:center}
    .btn{
      appearance:none;border:1px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer;
      border-radius:999px;padding:.45rem .75rem;font-weight:700;font-size:.9rem; box-shadow:none;
    }
    .btn:hover{box-shadow:var(--shadow)}
    .install{display:none}

    /* Container */
    #app{max-width:1100px;margin:0 auto 2.2rem;padding:0 1rem}

    /* Section & categories */
    #tek2day-pulse{
      background:var(--card);border:1px solid var(--line);border-radius:calc(var(--r) + 2px);
      padding:1.1rem; box-shadow:var(--shadow); margin-top:1rem;
    }
    .stack{display:grid;gap:1rem}
    details.cat{
      background:var(--card);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;
    }
    details.cat summary{
      list-style:none;cursor:pointer;padding:.95rem 1rem;display:flex;align-items:center;justify-content:space-between;
      border-bottom:1px solid var(--line); transition:background .15s ease;
    }
    details.cat[open] summary{background:color-mix(in srgb, var(--card) 90%, #fff 10%)}
    details.cat summary::-webkit-details-marker{display:none}
    .label{display:flex;gap:.6rem;align-items:center;font-weight:900;color:var(--ink)}
    .pill{
      display:inline-flex;align-items:center;gap:.5rem;padding:.25rem .6rem;border-radius:999px;font-size:.92rem;font-weight:800;color:#0b0b0b;
      background:#e9eefc;border:1px solid #dee6ff;
    }@media (prefers-color-scheme: dark){
      }
    .dot{width:.6rem;height:.6rem;border-radius:999px;display:inline-block}
    .ai .pill{background:#e9edff;border-color:#dfe5ff;color:#2d3b8f}
    .ft .pill{background:#e7fbf3;border-color:#d9f5eb;color:#0f6b57}
    .sw .pill{background:#fff0ea;border-color:#ffe4d8;color:#a9441b}
    .count{color:var(--muted);font-size:.9rem}

    .items{padding:.55rem 1rem 1rem;display:grid;gap:.75rem;grid-template-columns:1fr;}
    article{
      position:relative;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:.9rem;
      transition:transform .06s ease, box-shadow .12s ease; will-change:transform;
      display:flex;gap:.9rem;align-items:stretch;height:100%;
    }
    article:hover{transform:translateY(-1px); box-shadow:var(--shadow)}
    article.top{background:linear-gradient(180deg, color-mix(in srgb, var(--card) 92%, #fff 8%), var(--card)); border-width:1px}
    .article-thumb{
      width:120px;height:67.5px;border-radius:8px;object-fit:cover;flex-shrink:0;
      align-self:flex-start;
    }
    .article-content{flex:1;min-width:0;display:flex;flex-direction:column;}
    h3{margin:0 0 .4rem;font-size:1.15rem;line-height:1.3;font-weight:800;letter-spacing:-0.01em;}
    h3 a{color:var(--ink);text-decoration:none;transition:color 0.15s ease;}
    h3 a:hover{color:var(--ai);text-decoration:none;}
    .meta{color:var(--muted);font-size:.86rem;margin-bottom:.4rem;display:flex;gap:.4rem;align-items:center;flex-wrap:wrap}
    .meta .src{font-weight:700;letter-spacing:.1px}
    .meta .sep{opacity:.35}
    .badge{
      display:inline-block;padding:.15rem .4rem;border-radius:4px;font-size:.75rem;font-weight:700;
      background:var(--ai);color:white;margin-left:.25rem;
    }
    .badge.muted{background:var(--muted);opacity:.7;}
    p{margin:.25rem 0 0; color:var(--ink);flex:1;}

    /* Footer note */
    .foot{margin-top:1rem;color:var(--muted);font-size:12px;text-align:center}

    /* Sticky header shadow on scroll */
    header.site.shadow{ box-shadow: 0 10px 56px rgba(15,23,42,.08) }

    /* Small screens */
    @media (max-width: 640px){
      header.site h1{font-size:1.12rem}
      #tek2day-pulse{padding:.9rem}
      .items{padding:.45rem .6rem .8rem}
      article{padding:.8rem;flex-direction:column;}
      .article-thumb{width:100%;height:auto;aspect-ratio:16/9;}
    }

    /* ===== Share toolbar (minimal styles) ===== */
    .share{
      display:flex; gap:.5rem; margin-top:.35rem; flex-wrap:wrap;
    }
    .share-btn{
      appearance:none; -webkit-appearance:none;
      border:1px solid var(--line); background:#fff; color:var(--ink);
      border-radius:999px; padding:.3rem .6rem; font-size:.85rem; font-weight:600;
      text-decoration:none; cursor:pointer;
    }
    .share-btn:hover{ background:#f3f4f6; }
  </style>
  <link rel="icon" type="image/x-icon" href="./icons/favicon.ico">
  <link rel="icon" type="image/png" sizes="32x32" href="./icons/t2d-pulse-32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="./icons/t2d-pulse-16.png">
  <link rel="apple-touch-icon" sizes="180x180" href="./icons/t2d-pulse-180.png">

  <link rel="canonical" href="https://pulse.tek2dayholdings.com/" />
  <meta property="og:site_name" content="T2D Pulse">
  <meta property="og:image:alt" content="T2D Pulse — curated AI, Software & FinTech news">
  <meta name="description" content="AI, Software, and FinTech News.">
</head>

<body>
  <!-- Sticky site header -->
  <header class="site">
    <div class="site-inner">
      <a href="/" aria-label="T2D Pulse Home">
  <img class="brand-mark" src="./icons/T2D_Pulse_Logo_2.png" alt="T2D Pulse">
</a>
<h1 class="sr-only">T2D Pulse</h1>
<div class="tag">
  Snapshot: <span class="date">{{DATE_STR}}</span> — curated <strong>AI</strong>, <strong>Software</strong>, and <strong>FinTech</strong> News.
</div>
    <div class="grow"></div>
      <div class="hdr-actions">
        <div class="install"><button class="btn" id="btnInstall" aria-label="Install app">Install</button></div>
      </div>
    </div>
  </header>

  <div id="app">
    <section id="tek2day-pulse" aria-labelledby="tek2day-title">
      <div class="stack">
        <!-- AI -->
        <details class="cat ai" open>
          <summary>
            <span class="label">
              <span class="pill"><i class="dot" style="background:var(--ai)"></i>AI</span>
            </span>
            <span class="count">{{AI_COUNT}} items</span>
          </summary>
          <div class="items">
            {{AI_ITEMS}}
          </div>
        </details>

        <!-- Software -->
        <details class="cat sw" open>
          <summary>
            <span class="label">
              <span class="pill"><i class="dot" style="background:var(--sw)"></i>Software</span>
            </span>
            <span class="count">{{SW_COUNT}} items</span>
          </summary>
          <div class="items">
            {{SW_ITEMS}}
          </div>
        </details>

        <!-- FinTech -->
        <details class="cat ft" open>
          <summary>
            <span class="label">
              <span class="pill"><i class="dot" style="background:var(--ft)"></i>FinTech</span>
            </span>
            <span class="count">{{FT_COUNT}} items</span>
          </summary>
          <div class="items">
            {{FT_ITEMS}}
          </div>
        </details>
      </div>

      <p class="foot">T2D Pulse 2025.</p>
    </section>
  </div>

  <!-- Scripts: PWA + header shadow (no theme logic) -->
  <script>
    // Install prompt
    let deferredPrompt;
    window.addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault();
      deferredPrompt = e;
      const wrap = document.querySelector('.install');
      if (wrap) wrap.style.display = 'block';
    });
    document.getElementById('btnInstall')?.addEventListener('click', async () => {
      if (!deferredPrompt) return;
      deferredPrompt.prompt();
      await deferredPrompt.userChoice;
      deferredPrompt = null;
      document.querySelector('.install').style.display = 'none';
    });

    // Service worker
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js', { scope: './' });
      });
    }

    // Header shadow on scroll
    window.addEventListener('scroll', () => {
      const h = document.querySelector('header.site');
      if (!h) return;
      if (window.scrollY > 8) h.classList.add('shadow');
      else h.classList.remove('shadow');
    });
  </script>

  <!-- ===== Share buttons script ===== -->
  <script>
  (function () {
    const cards = document.querySelectorAll('#tek2day-pulse article');
    if (!cards.length) return;

    for (const card of cards) {
      const a = card.querySelector('h3 a');
      if (!a) continue;

      const originalUrl = a.href;
      const permalink = card.dataset.permalink || originalUrl;  // Use permalink if available, fallback to original
      const title = a.textContent.trim();
      const brand = 'via T2D Pulse';

      const shareTitle = `${title} — ${brand}`;
      const u = encodeURIComponent(permalink);
      const xShare = `https://twitter.com/intent/tweet?url=${u}&text=${encodeURIComponent(shareTitle)}`;

      // Toolbar with both Share to X and Copy URL buttons
      const bar = document.createElement('div');
      bar.className = 'share';
      bar.innerHTML = `
        <a class="share-btn" href="${xShare}" target="_blank" rel="noopener">Share to X</a>
        <button class="share-btn copy-url" type="button">Copy URL</button>
      `;
      const btn = bar.querySelector('.copy-url');
      btn.dataset.url = permalink;  // Use permalink for copying
      card.appendChild(bar);
    }

    // Copy URL handler
    document.addEventListener('click', async (e) => {
      const btn = e.target.closest('.copy-url');
      if (!btn) return;

      const url = btn.dataset.url;

      // Prefer native share on mobile (URL only)
      if (navigator.share) {
        try { await navigator.share({ url }); return; } catch(_) {}
      }

      try {
        await navigator.clipboard.writeText(url);
      } catch (err) {
        const ta = document.createElement('textarea');
        ta.value = url; document.body.appendChild(ta);
        ta.select(); document.execCommand('copy'); ta.remove();
      }
      const old = btn.textContent; btn.textContent = 'Copied!'; setTimeout(() => btn.textContent = old, 1200);
    });
  })();
  </script>
</body>
</html>
