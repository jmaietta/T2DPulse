<!doctype html>
<html lang="en">
<head>
  <!-- Google tag (gtag.js) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-HLPF1R9ZNL"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-HLPF1R9ZNL');
  </script>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>TEK2day Pulse — Technology News</title>

  <meta property="og:type" content="website">
  <meta property="og:title" content="TEK2day Pulse — Technology News">
  <meta property="og:description" content="Read TEK2day Pulse for the latest Technology news.">
  <meta property="og:url" content="https://pulse.tek2dayholdings.com/">
  <meta property="og:image" content="https://pulse.tek2dayholdings.com/og/social-card.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">

  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="TEK2day Pulse — Technology News">
  <meta name="twitter:description" content="Read TEK2day Pulse for the latest Technology news.">
  <meta name="twitter:image" content="https://pulse.tek2dayholdings.com/og/social-card.png">

  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "WebSite",
    "name": "TEK2day Pulse",
    "url": "https://pulse.tek2dayholdings.com/",
    "description": "Read TEK2day Pulse for the latest Technology news."
  }
  </script>

  <meta name="theme-color" content="#0f172a" />
  <link rel="manifest" href="./manifest.webmanifest" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="./pulse.css">

  <link rel="icon" type="image/x-icon" href="/favicon.ico">
  <link rel="icon" type="image/png" sizes="512x512" href="./icons/t2d-pulse-512.png">
  <link rel="icon" type="image/png" sizes="192x192" href="./icons/t2d-pulse-192.png">
  <link rel="icon" type="image/png" sizes="48x48" href="./icons/t2d-pulse-48.png">
  <link rel="icon" type="image/png" sizes="32x32" href="./icons/t2d-pulse-32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="./icons/t2d-pulse-16.png">
  <link rel="apple-touch-icon" sizes="180x180" href="./icons/t2d-pulse-180.png">

  <link rel="canonical" href="https://pulse.tek2dayholdings.com/" />
  <meta property="og:site_name" content="TEK2day Pulse">
  <meta property="og:image:alt" content="TEK2day Pulse — Technology News">
  <meta name="description" content="Read TEK2day Pulse for the latest Technology news.">
</head>

<body>
  <header class="site">
    <div class="site-inner">
      <a href="/" aria-label="TEK2day Pulse Home">
        <img class="brand-mark" src="./icons/t2d-pulse-192.png" alt="TEK2day Pulse">
      </a>
      <h1>TEK2day Pulse</h1>
      <div class="tag">
        <span class="date">{{DATE_STR}}</span>
        <span class="divider"></span>
        <span class="desc">Read <strong>TEK2day Pulse</strong> for the latest <strong>Technology</strong> news.</span>
      </div>
      <div class="grow"></div>
      <div class="hdr-actions">
        <form class="search" role="search" aria-label="Search articles">
          <label for="t2d-q" class="sr-only">Search articles</label>
          <svg class="search-icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-3.5-3.5"></path></svg>
          <input id="t2d-q" type="search" placeholder="Search stories or sources" enterkeyhint="search" autocapitalize="off" autocomplete="off" />
        </form>
      </div>
    </div>
  </header>

  <nav class="tabs" aria-label="Sections">
    <div class="tabs-inner" role="group" aria-label="Filter stories by section">
      <button type="button" class="tab is-active" data-category="all" aria-pressed="true">All stories <span class="count">{{COUNT_ALL}}</span></button>
      <button type="button" class="tab" data-category="ai" aria-pressed="false"><span class="dot dot--ai" aria-hidden="true"></span>AI <span class="count">{{COUNT_AI}}</span></button>
      <button type="button" class="tab" data-category="software" aria-pressed="false"><span class="dot dot--software" aria-hidden="true"></span>Software <span class="count">{{COUNT_SW}}</span></button>
      <button type="button" class="tab" data-category="fintech" aria-pressed="false"><span class="dot dot--fintech" aria-hidden="true"></span>FinTech <span class="count">{{COUNT_FT}}</span></button>
      <div class="grow"></div>
      <div class="updated">Updated <time id="last-updated" datetime="{{UPDATED_ISO}}">{{UPDATED_LABEL}}</time></div>
    </div>
  </nav>

  <div id="app">
    <section id="tek2day-pulse" aria-labelledby="tek2day-title">
      <div class="hero" id="hero">
        {{LEAD}}
        {{DAILY_BRIEF}}
      </div>
      <div class="section-head">
        <h2 id="tek2day-title" class="section-title">Latest</h2>
        <p class="section-note" id="result-count" role="status" aria-live="polite">Newest first · {{MORE_COUNT}} more stories</p>
      </div>
      <div class="items">
        {{ITEMS}}
      </div>
      <p class="foot">© 2026 TEK2day Pulse. All rights reserved.</p>
    </section>
  </div>

  <button id="back-to-top" class="back-to-top" aria-label="Back to top">
    <svg viewBox="0 0 24 24">
      <path d="M12 19V5M5 12l7-7 7 7" />
    </svg>
  </button>

  <script src="./pulse.js" defer></script>
</body>
</html>
