name: Check Pulse
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - run: python -m pip install -r generator/requirements.txt
      - run: python -m unittest discover -s tests -v
      - run: node --check docs/pulse.js && node --check docs/sw.js
