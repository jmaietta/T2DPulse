name: Build TEK2day Pulse (Website Only)

on:
  schedule:
    # Runs daily at 11:30 UTC (~7:30 AM ET; adjust for DST as needed)
    - cron: '30 11 * * *'
  workflow_dispatch: {}
  push:
    branches: [ "main" ]

permissions:
  contents: write

jobs:
  build-and-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r generator/requirements.txt

      - name: Generate TEK2day Pulse HTML
        run: |
          python generator/generate_pulse.py

      - name: Commit & push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if [ -n "$(git status --porcelain)" ]; then
            git add docs/index.html docs/pulse.json
            git commit -m "chore: daily TEK2day Pulse update"
            git push
          else
            echo "No changes to commit."
          fi
