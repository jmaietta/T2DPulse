name: Build TEK2day Pulse (Website Only)

on:
  push:
    branches: [ "main" ]      # <-- change to your default branch if not 'main'
    paths:
      - "generator/**"
      - "docs/**"
      - ".github/workflows/tek2day_pulse.yml"
      - "generator/requirements.txt"
  schedule:
    - cron: '30 11 * * *'     # 11:30 UTC daily (~7:30 AM ET)
  workflow_dispatch: {}        # manual button still useful

permissions:
  contents: write

concurrency:
  group: tek2day-pulse
  cancel-in-progress: true

jobs:
  build-and-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r generator/requirements.txt
          pip install tldextract==5.1.2
      - name: Generate
        run: python generator/generate_pulse.py
      - name: Commit & push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if [ -n "$(git status --porcelain)" ]; then
            git add docs/index.html docs/pulse.json
            git commit -m "chore: daily TEK2day Pulse update"
            git push
          else
            echo "No changes to commit."
          fi
