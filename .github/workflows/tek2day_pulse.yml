name: Build TEK2day Pulse (Website Only)

on:
  # NOTE: This cron runs every 5 hours (minute 0). If you truly want every 30 minutes, use: "*/30 * * * *"
  schedule:
    - cron: "0 */5 * * *"

  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pulse-prod
  cancel-in-progress: true

jobs:
  build:
    env:
      DISABLE_WEEKEND_CACHE: "1"

    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout main
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 1

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f generator/requirements.txt ]; then pip install -r generator/requirements.txt; fi
          pip install tldextract==5.1.2

      - name: ET weekday window verification
        run: |
          python - <<'PY'
          from datetime import datetime, time
          from zoneinfo import ZoneInfo
          now = datetime.now(ZoneInfo("America/New_York"))
          wd = now.weekday()  # 0=Mon, 6=Sun
          start = time(7,30); end = time(18,0)
          within = (0 <= wd <= 4) and (start <= now.time() <= end)
          print(f"Now ET: {now.isoformat(timespec='seconds')}  weekday={wd}  within_window={within}")
          if not within:
            print("Outside business hours - exiting gracefully")
            raise SystemExit(0)
          PY

      - name: Build site (writes to docs/)
        run: |
          python generator/generate_pulse.py

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: docs/

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
