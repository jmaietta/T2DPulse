name: Build TEK2day Pulse (Website Only)

on:
  # NOTE: This cron runs every 5 hours (minute 0). If you truly want every 30 minutes, use: "*/30 * * * *"
  schedule:
    - cron: "0 */5 * * *"

  workflow_dispatch: {}

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pulse-prod
  cancel-in-progress: true

jobs:
  build:
    env:
      DISABLE_WEEKEND_CACHE: "1"
      RETENTION_DAYS: "3"
      RETENTION_TZ: "America/New_York"

    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          # IMPORTANT: needed so git log can see when permalinks were last committed
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f generator/requirements.txt ]; then pip install -r generator/requirements.txt; fi
          pip install tldextract==5.1.2

      - name: ET weekday window verification
        run: |
          python - <<'PY'
          from datetime import datetime, time
          from zoneinfo import ZoneInfo
          now = datetime.now(ZoneInfo("America/New_York"))
          wd = now.weekday()  # 0=Mon, 6=Sun
          start = time(7,30); end = time(18,0)
          within = (0 <= wd <= 4) and (start <= now.time() <= end)
          print(f"Now ET: {now.isoformat(timespec='seconds')}  weekday={wd}  within_window={within}")
          if not within:
            print("Outside business hours - exiting gracefully")
            raise SystemExit(0)
          PY

      - name: Build site (writes to docs/)
        run: |
          python generator/generate_pulse.py

      - name: Prune archives & permalinks older than retention window
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob

          DAYS="${RETENTION_DAYS}"
          TZNAME="${RETENTION_TZ}"

          # Filenames are created using America/New_York in your generator, so compute cutoff in that TZ too.
          CUTOFF_DATE="$(TZ="${TZNAME}" date -d "${DAYS} days ago" +%F)"
          CUTOFF_EPOCH="$(TZ="${TZNAME}" date -d "${DAYS} days ago" +%s)"

          echo "Retention: keep dates >= ${CUTOFF_DATE} (${TZNAME}); delete anything earlier."
          echo "Cutoff epoch: ${CUTOFF_EPOCH}"

          # Ensure base dirs always exist (Git doesn't track empty dirs)
          mkdir -p docs/p docs/archive/json docs/archive/timestamped
          touch docs/p/.gitkeep docs/archive/json/.gitkeep docs/archive/timestamped/.gitkeep

          # 1) docs/archive/json/YYYY-MM-DD.json
          if [ -d "docs/archive/json" ]; then
            for f in docs/archive/json/*.json; do
              base="$(basename "$f")"
              d="${base%.json}"
              if [[ "$d" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]] && [[ "$d" < "$CUTOFF_DATE" ]]; then
                echo "Deleting (daily json) $f"
                rm -f "$f"
              fi
            done
          fi

          # 2) docs/archive/timestamped/YYYY-MM-DD_HHMMSS.json
          if [ -d "docs/archive/timestamped" ]; then
            for f in docs/archive/timestamped/*.json; do
              base="$(basename "$f")"
              d="${base:0:10}"
              if [[ "$d" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]] && [[ "$d" < "$CUTOFF_DATE" ]]; then
                echo "Deleting (timestamped) $f"
                rm -f "$f"
              fi
            done
          fi

          # 3) docs/p/<hash>/... (no timestamp in name)
          # Use git commit time of docs/p/<hash>/index.html to decide age.
          if [ -d "docs/p" ]; then
            for dir in docs/p/*/; do
              dir="${dir%/}"
              idx="${dir}/index.html"
              [ -f "$idx" ] || continue

              last_epoch="$(git log -1 --format=%ct -- "$idx" 2>/dev/null || echo 0)"
              if [ "$last_epoch" -lt "$CUTOFF_EPOCH" ]; then
                echo "Deleting permalink dir $dir (last commit epoch: $last_epoch)"
                rm -rf "$dir"
              fi
            done
          fi

          echo "Post-cleanup sizes:"
          du -sh docs/ || true
          echo "Counts:"
          echo "  archive/json:        $(ls -1 docs/archive/json 2>/dev/null | wc -l || true)"
          echo "  archive/timestamped: $(ls -1 docs/archive/timestamped 2>/dev/null | wc -l || true)"
          echo "  permalink dirs:      $(ls -d docs/p/*/ 2>/dev/null | wc -l || true)"

      - name: Commit & push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # IMPORTANT: -A is what actually stages deletions
          git add -A docs/

          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore: prune docs archives (keep ${RETENTION_DAYS} days)"
            git push origin HEAD:main
          fi

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
