name: Build TEK2day Pulse (Website Only)

on:
  # NOTE: This cron runs every 5 hours (minute 0). If you truly want every 30 minutes, use: "*/30 * * * *"
  schedule:
    - cron: "0 */5 * * *"

  workflow_dispatch: {}

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pulse-prod
  cancel-in-progress: true

jobs:
  build:
    env:
      DISABLE_WEEKEND_CACHE: "1"
      RETENTION_DAYS: "3"
      RETENTION_TZ: "America/New_York"

    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          # IMPORTANT: needed so git log can see when permalinks were last committed
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f generator/requirements.txt ]; then pip install -r generator/requirements.txt; fi
          pip install tldextract==5.1.2

      - name: ET weekday window verification
        run: |
          python - <<'PY'
          from datetime import datetime, time
          from zoneinfo import ZoneInfo
          now = datetime.now(ZoneInfo("America/New_York"))
          wd = now.weekday()  # 0=Mon, 6=Sun
          start = time(7,30); end = time(18,0)
          within = (0 <= wd <= 4) and (start <= now.time() <= end)
          print(f"Now ET: {now.isoformat(timespec='seconds')}  weekday={wd}  within_window={within}")
          if not within:
            print("Outside business hours - exiting gracefully")
            raise SystemExit(0)
          PY

      - name: Build site (writes to docs/)
        run: |
          python generator/generate_pulse.py

      - name: Prune archives & permalinks older than retention window
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob

          DAYS="${RETENTION_DAYS}"
          TZNAME="${RETENTION_TZ}"

          # Filenames are created using America/New_York in your generator, so compute cutoff in that TZ too.
          CUTOFF_DATE="$(TZ="${TZNAME}" date -d "${DAYS} days ago" +%F)"
          CUTOFF_EPOCH="$(TZ="${TZNAME}" date -d "${DAYS} days ago" +%s)"

          echo "Retention: keep dates >= ${CUTOFF_DATE} (${TZNAME}); delete anything earlier."
          echo "Cutoff epoch: ${CUTOFF_EPOCH}"

          # Ensure base dirs always exist (Git doesn't track empty dirs)
          mkdir -p docs/p docs/archive/json docs/archive/timestamped
          touch docs/p/.gitkeep docs/archive/json/.gitkeep docs/archive/timestamped/.gitkeep

          # 1) docs/archive/json/YYYY-MM-DD.json
          if [ -d "docs/archive/json" ]; then
            for f in docs/archive/json/*.json; do
              base="$(basename "$f")"
              d="${base%.json}"
              if [[ "$d" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]] && [[ "$d" < "$CUTOFF_DATE" ]]; then
                echo "Deleting (daily json) $f"
                rm -f "$f"
              fi
            done
          fi

          # 2) docs/archive/timestamped/YYYY-MM-DD_HHMMSS.json
          if [ -d "docs/archive/timestamped" ]; then
            for f in docs/archive/timestamped/*.json; do
              base="$(basename "$f")"
              d="${base:0:10}"
              if [[ "$d" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]] && [[ "$d" < "$CUTOFF_DATE" ]]; then
                echo "Deleting (timestamped) $f"
                rm -f "$f"
              fi
            done
          fi

          # 3) docs/p/<hash>/... (no timestamp in name)
          #    Keep only permalinks that are referenced by the *remaining* (recent) JSON files.
          #    This avoids relying on git commit times, which can be misleading.
          python - <<'PY'
          import json, glob, re, os, sys
          keep=set()
          rx_url = re.compile(r"/p/([A-Za-z0-9_-]{6,80})")
          rx_token = re.compile(r"^[A-Za-z0-9_-]{6,80}$")
          key_names = {"p","permalink","permalink_id","permalink_hash","permalinkkey","permalink_key","permalinkvalue","permalink_value"}

          def add(tok: str) -> None:
            if not tok:
              return
            tok = tok.strip()
            # Extract from URL-ish strings like https://.../p/<hash>
            m = rx_url.search(tok)
            if m:
              tok = m.group(1)
            # Allow forms like p/<hash>
            if tok.startswith('p/'):
              tok = tok[2:]
            if '/' in tok:
              return
            if rx_token.match(tok):
              keep.add(tok)
              # Some generators store a longer token but docs/p uses a shortened folder name (often 10 chars).
              if len(tok) > 10:
                keep.add(tok[:10])

          def walk(obj) -> None:
            if isinstance(obj, dict):
              for k, v in obj.items():
                lk = str(k).lower()
                if isinstance(v, str):
                  if lk in key_names:
                    add(v)
                  for t in rx_url.findall(v):
                    add(t)
                walk(v)
            elif isinstance(obj, list):
              for it in obj:
                walk(it)
            elif isinstance(obj, str):
              for t in rx_url.findall(obj):
                add(t)

          files = glob.glob('docs/archive/json/*.json') + glob.glob('docs/archive/timestamped/*.json')
          for fp in files:
            try:
              with open(fp, 'r', encoding='utf-8') as f:
                walk(json.load(f))
            except Exception as e:
              print(f'warn: {fp}: {e}', file=sys.stderr)

          os.makedirs('.tmp', exist_ok=True)
          with open('.tmp/keep_p.txt', 'w', encoding='utf-8') as out:
            for t in sorted(keep):
              out.write(t + '\n')
          print(f'Active permalink tokens found: {len(keep)}')
          PY

          if [ -d "docs/p" ]; then
            echo "Pruning docs/p by JSON reference..."
            if [ ! -s .tmp/keep_p.txt ]; then
              echo "WARN: keep list is empty; skipping docs/p pruning to avoid deleting everything."
            else
              for dir in docs/p/*/; do
                dir="${dir%/}"
                base="$(basename "$dir")"
                if ! grep -Fxq "$base" .tmp/keep_p.txt; then
                  echo "Deleting orphaned permalink dir $dir"
                  rm -rf "$dir"
                fi
              done
            fi
          fi


          echo "Post-cleanup sizes:"
          du -sh docs/ || true
          echo "Counts:"
          echo "  archive/json:        $(ls -1 docs/archive/json 2>/dev/null | wc -l || true)"
          echo "  archive/timestamped: $(ls -1 docs/archive/timestamped 2>/dev/null | wc -l || true)"
          echo "  permalink dirs:      $(ls -d docs/p/*/ 2>/dev/null | wc -l || true)"

      - name: Commit & push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # IMPORTANT: -A is what actually stages deletions
          git add -A docs/

          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore: prune docs archives (keep ${RETENTION_DAYS} days)"
            git push origin HEAD:main
          fi

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
